<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- #region Links-->
<link rel="icon" href="images/favicon-16x16.png">
<link rel="stylesheet" href="./css/style.css">

<!-- #region Main JS-->
<script defer src="./js/script.js"></script>

    <title>Pokédex</title>
</head>
<body>
    
<main>
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/6.gif" alt="pokemon" class="pokemon__image">

<h1 class="pokemon_data">
    <span class="pokemon_number"></span> -
    <span class="pokemon_name"></span>
</h1>

<form class="form">
<input 
type="search"
class="input__search"
placeholder="Digite um nome ou número..."
required
/>
</form>

<div class="buttons">
    <button class="button btn-prev">Prev &lt;</button>
    <button class="button btn-next">Next &gt;</button>
</div>

<img src="./images/pokedex.png" alt="pokedex" class="pokedex">
</main>

</body>
</html>
